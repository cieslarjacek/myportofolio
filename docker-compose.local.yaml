# Local-only overlay, loaded only by "make run-app". Never deploy to the server.
#
# The app reads MINIO_ENDPOINT=minio:9000 from the vault (LOCAL_RUN=false).
# On the server "minio" resolves on the appnet Docker network. Locally there is
# no minio container: the SSH tunnel listens on the docker0 gateway
# (172.17.0.1:9000), so "minio" is mapped to that address. Both environments then
# use the identical vault configuration.
services:
  shiny-app:
    extra_hosts:
      - "minio:host-gateway"