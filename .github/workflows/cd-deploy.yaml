name: CD - Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, test, prod)"
        required: true
        type: string
      version:
        description: "Image version to deploy"
        required: true
        type: string
      app_name:
        description: "Application name (from DESCRIPTION Package field)"
        required: true
        type: string
      app_url:
        description: "Public URL of the environment"
        required: true
        type: string
      source_env:
        description: "Source environment to retag from (PROD only - retags from test)"
        required: false
        type: string
        default: ""
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.repository_owner }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.app_url }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm deployment target
        run: |
          echo "Deploying '${{ inputs.app_name }}-${{ inputs.environment }}:${{ inputs.version }}' to ${{ inputs.environment }}"

      # DEV + TEST - image pushed directly by CI, just verify it exists
      - name: Verify image exists in GHCR
        if: inputs.source_env == ''
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ inputs.app_name }}-${{ inputs.environment }}:${{ inputs.version }} \
            || (echo "Image not found in GHCR - ensure the CI pipeline completed successfully" && exit 1)

      # PROD only - verify source (test) image exists, check version label, retag and push
      - name: Verify TEST image exists in GHCR
        if: inputs.source_env != ''
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ inputs.app_name }}-${{ inputs.source_env }}:${{ inputs.version }} \
            || (echo "Version ${{ inputs.version }} not found in ${{ inputs.source_env }} - deploy to TEST first" && exit 1)

      - name: Verify version label matches
        if: inputs.source_env != ''
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ inputs.app_name }}-${{ inputs.source_env }}:${{ inputs.version }}
          LABEL_VERSION=$(docker inspect --format '{{ index .Config.Labels "version" }}' ${IMAGE})
          if [ "${LABEL_VERSION}" != "${{ inputs.version }}" ]; then
            echo "Version label mismatch: image has '${LABEL_VERSION}', expected '${{ inputs.version }}'"
            exit 1
          fi
          echo "Version label verified: ${LABEL_VERSION}"

      - name: Retag from TEST and push as PROD
        if: inputs.source_env != ''
        run: |
          SOURCE=${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ inputs.app_name }}-${{ inputs.source_env }}:${{ inputs.version }}
          TARGET=${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ inputs.app_name }}-${{ inputs.environment }}:${{ inputs.version }}
          docker tag  ${SOURCE} ${TARGET}
          docker push ${TARGET}

      # All environments - trigger the deploy on the server.
      #
      # The deploy key is pinned to a forced command on the server
      # ("/usr/local/sbin/deploy-app"), which reads this string from
      # SSH_ORIGINAL_COMMAND and accepts only "deploy <env> <version>".
      #
      # Plain OpenSSH from the runner image: no third-party code handles the key
      # (appleboy/ssh-action downloaded an unverified drone-ssh binary at runtime).
      # Host verification: known_hosts built from the pinned public host key.
      - name: Deploy to server via SSH
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST_KEY: ${{ vars.SERVER_SSH_HOST_KEY }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${SSH_HOST_KEY:?repository variable SERVER_SSH_HOST_KEY is not set}"
          # Key and known_hosts are created 0600 in a job-private temp dir, removed on exit.
          umask 077
          ssh_dir="${RUNNER_TEMP}/ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          # OpenSSH requires a trailing newline after the private key block.
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/id_deploy"
          # Non-default port => known_hosts entry must use the [host]:port form.
          printf '[%s]:2222 %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          # No -t: no pty is requested, so the wrapper logs tty=none.
          # ssh exits with the wrapper's status, so a failed deploy fails the job.
          timeout 10m ssh -p 2222 \
            -i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" "deploy ${DEPLOY_ENV} ${DEPLOY_VERSION}"
