name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Least-privilege default for every job. Jobs that need more raise it locally:
#   build / push  -> packages: write (GHCR image and buildx registry cache)
#   cleanup       -> contents: write (deletes the merged branch)
permissions:
  contents: read

# Pipeline logic:
#   feature/* >>> develop       : full CI, version format X.X.X.XXXX, push as myportfolio-dev
#   release/* >>> develop       : preflight only, no deploy
#   bugfix/*  >>> release/X.X.X : full CI, version format X.X.X, push as myportfolio-test
#   hotfix/*  >>> release/X.X.X : full CI, version format X.X.X, push as myportfolio-test

jobs:
  # 0. Pre-flight
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event.action != 'closed' &&
      (
        (github.base_ref == 'develop' && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'release/'))) ||
        (startsWith(github.base_ref, 'release/') && (startsWith(github.head_ref, 'bugfix/') || startsWith(github.head_ref, 'hotfix/')))
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate source branch
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" == "develop" ]]; then
            if [[ ! "$BRANCH" =~ ^(feature|release)/.+ ]]; then
              echo "PRs to 'develop' must originate from 'feature/*' or 'release/*'."
              exit 1
            fi
          elif [[ "$BASE" =~ ^release/.+ ]]; then
            if [[ ! "$BRANCH" =~ ^(bugfix|hotfix)/.+ ]]; then
              echo "PRs to 'release/X.X.X' must originate from 'bugfix/*' or 'hotfix/*'."
              exit 1
            fi
          fi
          echo "Branch '$BRANCH' to '$BASE' is valid."

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a

  # 1. Docker build + SAST gate
  # SAST (Static Application Security Testing) gate logic:
  #   1. Warm build (shared GHCR layer cache) -> Trivy scan.
  #   2. Fixable HIGH/CRITICAL findings -> ONE cold no cache rebuild
  #      (and refreshment of the shared cache for later PRs) -> final Trivy scan.
  #   3. The final scan decides the job. No retries beyond that, no re-triggers.
  build:
    name: Docker build and SAST
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      (github.base_ref == 'develop' && startsWith(github.head_ref, 'feature/')) ||
      (startsWith(github.base_ref, 'release/') && (startsWith(github.head_ref, 'bugfix/') || startsWith(github.head_ref, 'hotfix/')))
    env:
      CI: true
    outputs:
      app_name: ${{ steps.app_specs.outputs.app_name }}
      app_version: ${{ steps.app_specs.outputs.app_version }}
      env_name: ${{ steps.app_specs.outputs.env_name }}
      image_name: ${{ steps.app_specs.outputs.image_name }}
      cold_rebuild: ${{ steps.sast_gate.outputs.rebuild == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract APP specs
        id: app_specs
        run: |
          APP_NAME=$(grep '^Package:' DESCRIPTION | cut -d ' ' -f2)
          APP_VERSION=$(grep '^Version:' DESCRIPTION | cut -d ' ' -f2)

          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            ENV_NAME="dev"
          elif [[ "${{ github.base_ref }}" =~ ^release/.+ ]]; then
            ENV_NAME="test"
          fi

          IMAGE_NAME="${APP_NAME}-${ENV_NAME}"
          CI_IMAGE_NAME="${APP_NAME}-ci"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "ci_image_name=$CI_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_ENV

      - name: Validate version format
        run: |
          BASE="${{ github.base_ref }}"
          VERSION="${{ steps.app_specs.outputs.app_version }}"

          if [[ "$BASE" == "develop" ]]; then
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: '${VERSION}' - feature/* requires X.X.X.XXXX format"
              exit 1
            fi
          elif [[ "$BASE" =~ ^release/.+ ]]; then
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: '${VERSION}' - bugfix/* and hotfix/* require X.X.X format"
              exit 1
            fi
          fi
          echo "Version '${VERSION}' is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image (warm)
        run: make docker-build ENV_NAME="${ENV_NAME}"

      - name: SAST check (warm image)
        id: sast_warm
        continue-on-error: true
        run: make ci-sast ENV_NAME="${ENV_NAME}" SAST_LOGFILE=ci_sast_warm.log

      - name: SAST gate
        id: sast_gate
        if: steps.sast_warm.outcome == 'failure'
        run: |
          if grep -qE '^Total: [1-9]' ci_sast_warm.log; then
            echo "::warning::Fixable HIGH/CRITICAL findings in cached layers - one cold rebuild follows."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Trivy failed without vulnerability findings - see ci_sast_warm.log."
            exit 1
          fi

      - name: Rebuild production image from scratch (cold)
        if: steps.sast_gate.outputs.rebuild == 'true'
        run: make docker-rebuild ENV_NAME="${ENV_NAME}"

      - name: SAST check (cold image)
        if: steps.sast_gate.outputs.rebuild == 'true'
        run: make ci-sast ENV_NAME="${ENV_NAME}" SAST_LOGFILE=ci_sast_cold.log

      - name: Upload SAST logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-log
          path: |
            ci_sast_warm.log
            ci_sast_cold.log
            docker_rebuild.log
          if-no-files-found: ignore
          retention-days: ${{ vars.LOG_RETENTION_PERIOD }}

      - name: Build CI image
        run: make docker-build-ci ENV_NAME="${ENV_NAME}"

      - name: Upload build log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-build-log
          path: docker_build.log
          retention-days: ${{ vars.LOG_RETENTION_PERIOD }}

      - name: Save production image for push job
        run: |
          docker save ${{ steps.app_specs.outputs.image_name }} \
            | gzip > /tmp/image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: ${{ vars.IMAGE_RETENTION_PERIOD }}

      - name: Save CI image for check jobs
        run: |
          docker save ${{ steps.app_specs.outputs.ci_image_name }} \
            | gzip > /tmp/image-ci.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image-ci
          path: /tmp/image-ci.tar.gz
          retention-days: ${{ vars.IMAGE_RETENTION_PERIOD }}

  # 2. Linting
  linting:
    name: Linting check
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-ci
          path: /tmp

      - name: Load CI image
        run: docker load < /tmp/image-ci.tar.gz

      - name: Run linting check
        run: make ci-linting

      - name: Upload linting log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linting-log
          path: ci_linting.log
          retention-days: ${{ vars.LOG_RETENTION_PERIOD }}

  # 3. Coverage
  coverage:
    name: Coverage check
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-ci
          path: /tmp

      - name: Load CI image
        run: docker load < /tmp/image-ci.tar.gz

      - name: Run coverage check
        run: make ci-coverage

      - name: Upload coverage log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-log
          path: ci_coverage.log
          retention-days: ${{ vars.LOG_RETENTION_PERIOD }}

  # 4. Unit tests
  unit-tests:
    name: Unit tests check
    needs: [linting, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-ci
          path: /tmp

      - name: Load CI image
        run: docker load < /tmp/image-ci.tar.gz

      - name: Run unit tests check
        run: make ci-unit-tests

      - name: Upload unit test log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-tests-log
          path: ci_unittests.log
          retention-days: ${{ vars.LOG_RETENTION_PERIOD }}

  # 5. Push production image to GHCR
  push:
    name: Push image to GHCR
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load production image
        run: docker load < /tmp/image.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          APP_VERSION="${{ needs.build.outputs.app_version }}"
          IMAGE_NAME="${{ needs.build.outputs.image_name }}"
          TARGET="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

          docker tag ${IMAGE_NAME} ${TARGET}:${APP_VERSION}
          docker tag ${IMAGE_NAME} ${TARGET}:${{ github.sha }}
          docker tag ${IMAGE_NAME} ${TARGET}:latest
          docker push ${TARGET}:${APP_VERSION}
          docker push ${TARGET}:${{ github.sha }}
          docker push ${TARGET}:latest

  # 6. Report
  report:
    name: Report
    needs: [build, unit-tests, push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    steps:
      - name: Download all logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: logs/

      - name: Write job summary
        env:
          COLD_REBUILD: ${{ needs.build.outputs.cold_rebuild }}
          PUSH_RESULT: ${{ needs.push.result }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## CI Pipeline Summary

          | Stage          | Log                                      |
          |----------------|------------------------------------------|
          | Docker build   | \`docker_build.log\`                     |
          | SAST (warm)    | \`ci_sast_warm.log\`                     |
          | Cold rebuild   | ${COLD_REBUILD} (\`docker_rebuild.log\`) |
          | SAST (rebuilt) | \`ci_sast_cold.log\`                     |
          | Linting        | \`ci_linting.log\`                       |
          | Coverage       | \`ci_coverage.log\`                      |
          | Unit tests     | \`ci_unittests.log\`                     |
          | GHCR push      | ${PUSH_RESULT}                           |
          EOF

  # 7. Cleanup - delete short-lived branch after merge
  cleanup:
    name: Delete merged branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'feature/') ||
       startsWith(github.head_ref, 'bugfix/')  ||
       startsWith(github.head_ref, 'hotfix/'))
    steps:
      - name: Delete branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.payload.pull_request.head.ref}`
            });
