name: CD Pipeline

on:
  push:
    branches:
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [test, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level default. Every scope not named here becomes "none", so each
# job that calls "cd-deploy.yaml" must grant the scopes that job needs.
permissions:
  contents: read

# Pipeline logic:
#   CI merges feature/* >>> develop        : auto-deploy to DEV
#   CI merges bugfix/*  >>> release/X.X.X  : auto-deploy to TEST
#   CI merges hotfix/*  >>> release/X.X.X  : auto-deploy to TEST
#   Manual trigger                         : promote to TEST or PROD
#
# Vault token renewal is NOT part of this pipeline. The server renews its own
# token daily via vault-renew-app-token.timer, so no Vault credential is held
# in GitHub.

jobs:
  # 0. Validate and extract version
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      app_name: ${{ steps.vars.outputs.app_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract and validate version
        id: vars
        run: |
          APP_NAME=$(grep '^Package:' DESCRIPTION | cut -d ' ' -f2)
          VERSION=$(grep '^Version:' DESCRIPTION | cut -d ' ' -f2)

          # DEV (develop branch): X.X.X or X.X.X.XXXX
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "Invalid version: '${VERSION}' - DEV requires X.X.X or X.X.X.XXXX format"
              exit 1
            fi

          # TEST / PROD (release/X.X.X branch or manual trigger): X.X.X only
          elif [[ "${{ github.ref_name }}" =~ ^release/.+ ]] || \
               [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: '${VERSION}' - TEST and PROD require X.X.X format"
              exit 1
            fi
          fi

          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}"   >> $GITHUB_OUTPUT
          echo "Version '${VERSION}' for '${APP_NAME}' is valid."

  # 1. Deploy to DEV (auto on merge to develop)
  deploy-dev:
    name: Deploy to DEV
    needs: [validate]
    if: github.event_name == 'push' && github.ref_name == 'develop'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-deploy.yaml
    secrets: inherit
    with:
      environment: dev
      version: ${{ needs.validate.outputs.version }}
      app_name: ${{ needs.validate.outputs.app_name }}
      app_url: ${{ vars.APP_DEV_URL }}

  # 2. Deploy to TEST (auto on merge to release/X.X.X, or manual)
  deploy-test:
    name: Deploy to TEST
    needs: [validate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'release/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-deploy.yaml
    secrets: inherit
    with:
      environment: test
      version: ${{ needs.validate.outputs.version }}
      app_name: ${{ needs.validate.outputs.app_name }}
      app_url: ${{ vars.APP_TEST_URL }}

  # 3. Promote to PROD (manual only, retags from test)
  deploy-prod:
    name: Deploy to PROD
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-deploy.yaml
    secrets: inherit
    with:
      environment: prod
      version: ${{ needs.validate.outputs.version }}
      app_name: ${{ needs.validate.outputs.app_name }}
      app_url: ${{ vars.APP_PROD_URL }}
      source_env: test